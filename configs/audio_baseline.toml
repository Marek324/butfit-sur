# Baseline audio system: 10-dim utterance features + balanced logreg.
# Single-target verification of m431.

name = "audio_baseline_logreg"
modality = "audio"

[data]
target_id = "m431"
train_dirs = ["dataset/target_train", "dataset/non_target_train"]
dev_dirs   = ["dataset/target_dev",   "dataset/non_target_dev"]

[validation]
strategy = "holdout_dev"      # | "session_grouped_cv" for HP tuning
cv_folds = 2

# Energy + ZCR VAD (pure DSP, no learned models).
[audio.vad]
algorithm = "energy_zcr"
frame_ms = 25
hop_ms = 10
preemphasis = 0.97
noise_percentile = 10.0
energy_margin_db = 8.0
zcr_aid_margin_db = 4.0
zcr_low = 0.02
zcr_high = 0.35
min_speech_ms = 100
min_silence_ms = 100

# 10-dim utterance vector: 5 prosodic + 5 CMVN-MFCC means.
[audio.features]
f0_method = "pyin"
f0_min_hz = 60.0
f0_max_hz = 400.0
include = ["log_f0_mean", "log_f0_std", "jitter_local", "shimmer_local", "voicing_ratio"]
mfcc_n_means = 5
mfcc_n = 13
mel_filters = 23
cmvn = "per_utterance"

# Train-time augmentation (target only; non-target left alone since the prior
# is 50/50 by assignment and class_weight='balanced' handles count imbalance).
[audio.augment.train]
enabled = true
n_per_target = 15
n_per_nontarget = 0
seed = 42

[audio.augment.train.waveform]
time_stretch_range = [0.9, 1.1]
gain_db_range = [-6.0, 6.0]
polarity_flip_p = 0.5
crop_min_s = 5.0
eq_enabled = true
eq_gain_db_range = [-3.0, 3.0]
eq_freq_hz_range = [200.0, 4000.0]
eq_q = 1.0

[audio.augment.train.feature_space]
enabled = false
sigma_per_dim_source = "non_target_within_speaker"
sigma_multiplier = 1.0

# Dev-time augmentation. OFF by default. If turned on, ranges should be
# DISJOINT from the train envelope so dev still measures generalization,
# not train-time invariance.
[audio.augment.dev]
enabled = false
n_per_target = 5
seed = 43

[audio.augment.dev.waveform]
time_stretch_range = [0.80, 0.88]   # disjoint from train's [0.9, 1.1]
gain_db_range = [-12.0, -7.0]
polarity_flip_p = 0.5
crop_min_s = 5.0
eq_enabled = true
eq_gain_db_range = [-6.0, -3.0]
eq_freq_hz_range = [4000.0, 7000.0]
eq_q = 1.0

[classifier]
type = "logreg"

[classifier.logreg]
C = 1.0
class_weight = "balanced"     # "" disables; "balanced" enforces 50/50 prior
penalty = "l2"
max_iter = 1000

[output]
result_filename = "audio_logreg.txt"
score = "logit"               # log-odds; higher = more m431
hard_threshold_logit = 0.0    # logit=0 ⇔ P(target)=0.5 ⇔ assignment 50/50 prior

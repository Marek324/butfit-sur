# Baseline audio system: 10-dim utterance features + balanced logreg.
# Single-target verification of m431.
#
# Augmentation is applied OFFLINE — run once, then training picks up
# augmented samples from disk via train_dirs:
#   uv run scripts/augment_dataset.py --config configs/augment_audio.toml

name = "audio_baseline_logreg"
modality = "audio"

[data]
target_id = "m431"
train_dirs = [
    "dataset/target_train",
    "dataset/target_train_aug",
    "dataset/non_target_train",
    "dataset/non_target_train_aug",
]
dev_dirs   = ["dataset/target_dev", "dataset/non_target_dev"]
eval_dirs  = ["dataset/eval"]

[validation]
strategy = "holdout_dev"      # | "session_grouped_cv" for HP tuning
cv_folds = 2

# Energy + ZCR VAD (pure DSP, no learned models).
[audio.vad]
algorithm = "energy_zcr"
frame_ms = 25
hop_ms = 10
preemphasis = 0.97
noise_percentile = 10.0
energy_margin_db = 8.0
zcr_aid_margin_db = 4.0
zcr_low = 0.02
zcr_high = 0.35
min_speech_ms = 100
min_silence_ms = 100

# 18-dim utterance vector: 5 prosodic + 13 CMVN-MFCC means.
# Promoted from configs/experiments/audio_more_mfcc.toml after the audio sweep
# — best clean-dev metrics (AUC 0.983, EER 3.33%, 3 errors @ logit=0). See
# docs/devjournal/2026-05-03-audio-experiments.md.
[audio.features]
f0_method = "pyin"
f0_min_hz = 60.0
f0_max_hz = 400.0
include = ["log_f0_mean", "log_f0_std", "jitter_local", "shimmer_local", "voicing_ratio"]
mfcc_n_means = 13
mfcc_n = 13
mel_filters = 23
cmvn = "per_utterance"

[classifier]
type = "logreg"

[classifier.logreg]
C = 1.0
class_weight = "balanced"     # "" disables; "balanced" enforces 50/50 prior
penalty = "l2"
max_iter = 1000

[output]
result_filename = "audio_logreg.txt"
score = "logit"               # log-odds; higher = more m431
hard_threshold_logit = 0.0    # logit=0 ⇔ P(target)=0.5 ⇔ assignment 50/50 prior

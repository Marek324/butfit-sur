# Offline waveform augmentation. Consumed by:
#   uv run scripts/augment_dataset.py --config configs/augment_audio.toml
#
# Writes 15 augmented variants per target sample (none for non-target — class
# imbalance is handled at fit time by `class_weight='balanced'`) into
# dataset/target_train_aug/. Augmented filenames are <stem>_aug{kk}.wav so
# session-grouped CV puts the parent and its children in the same fold.

modality = "audio"

source_target_dir    = "dataset/target_train"
source_nontarget_dir = "dataset/non_target_train"
output_target_dir    = "dataset/target_train_aug"
output_nontarget_dir = "dataset/non_target_train_aug"

n_per_target    = 15
# Non-target augmentation. With noise enabled in [waveform], a 0 here would
# leave non-targets clean while every target sample is noisy ⇒ the model can
# pick up "is this noisy?" as a target-discriminating cue, biasing the
# threshold-0 (50/50-prior) decision toward false negatives. Keep noise
# coverage roughly class-symmetric.
n_per_nontarget = 5
seed            = 42

# Waveform-level transforms chosen to be invariant under speaker identity.
# Pitch shift, heavy reverb, and SpecAugment are deliberately not here.
[waveform]
time_stretch_range = [0.9, 1.1]
gain_db_range      = [-6.0, 6.0]
polarity_flip_p    = 0.5
crop_min_s         = 5.0
eq_enabled         = true
eq_gain_db_range   = [-3.0, 3.0]
eq_freq_hz_range   = [200.0, 4000.0]
eq_q               = 1.0
# AWGN at a sampled SNR (computed against post-gain signal RMS).
# Set both endpoints to a high value (e.g. [60, 60]) to disable.
noise_snr_db_range = [15.0, 30.0]

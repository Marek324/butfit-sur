# Offline image augmentation. Consumed by:
#   uv run scripts/augment_dataset.py --config configs/augment_image.toml
#
# Writes 15 augmented variants per target sample. Augmented filenames are
# <stem>_aug{kk}.png so session-grouped CV puts the parent and its children
# in the same fold.

modality = "image"

source_target_dir    = "dataset/target_train"
source_nontarget_dir = "dataset/non_target_train"
output_target_dir    = "dataset/target_train_aug"
output_nontarget_dir = "dataset/non_target_train_aug"

n_per_target    = 15
# See augment_audio.toml for rationale: keep noise coverage class-symmetric so
# the model doesn't learn "noisy → target" and break the 50/50-prior decision.
n_per_nontarget = 5
seed            = 42

# Identity-preserving image transforms. Vertical flip, large rotations, and
# hue rotation are deliberately not here.
[envelope]
horizontal_flip_p   = 0.5
rotation_deg_range  = [-10.0, 10.0]
brightness_range    = [0.85, 1.15]
contrast_range      = [0.85, 1.15]
translate_pct       = 0.05
crop_pct            = 0.0
# Per-pixel-per-channel additive Gaussian noise; sigma in [0,1] image units.
# Set [0.0, 0.0] to disable.
noise_sigma_range   = [0.0, 0.04]

# Audio experiment: extend the baseline with speaker-discriminative,
# augmentation-aware descriptors. Each new feature has a known relationship
# to one of our augmentations (see docstring of src/audio_features.py):
#   - Formants F1–F3 (log-Hz medians) - VTL-covariant, gain-invariant
#   - F2/F1, F3/F1 ratios - VTL-INVARIANT and discriminative
#   - Spectral centroid (log-Hz mean) - pitch-covariant, EQ-bounded

name = "audio_exp_speaker_features"
modality = "audio"

[data]
target_id = "m431"
train_dirs = [
    "dataset/target_train",
    "dataset/target_train_aug",
    "dataset/non_target_train",
    "dataset/non_target_train_aug",
]
dev_dirs   = ["dataset/target_dev", "dataset/non_target_dev"]
eval_dirs  = ["dataset/eval"]

[audio.vad]
algorithm = "energy_zcr"
frame_ms = 25
hop_ms = 10
preemphasis = 0.97
noise_percentile = 10.0
energy_margin_db = 8.0
zcr_aid_margin_db = 4.0
zcr_low = 0.02
zcr_high = 0.35
min_speech_ms = 100
min_silence_ms = 100

[audio.features]
f0_method = "pyin"
f0_min_hz = 60.0
f0_max_hz = 400.0
include = [
    # Existing 5 prosodic features
    "log_f0_mean", "log_f0_std", "jitter_local", "shimmer_local", "voicing_ratio",
    # NEW: formant medians (VTL-covariant, gain-invariant) and ratios (VTL-invariant)
    "f1_median", "f2_median", "f3_median",
    "f2_f1_ratio", "f3_f1_ratio",
    # NEW: spectral centroid (pitch-covariant, EQ-bounded)
    "spectral_centroid_log_mean",
]
mfcc_n_means = 5
mfcc_n = 13
mel_filters = 23
cmvn = "per_utterance"

[classifier]
type = "logreg"

[classifier.logreg]
C = 1.0
class_weight = "balanced"
penalty = "l2"
max_iter = 1000

[output]
result_filename = "audio_speaker_features.txt"
score = "logit"
hard_threshold_logit = 0.0

# Audio experiment: same baseline features, SVM-RBF instead of logreg.
# Tests if a non-linear kernel finds structure linear logreg misses on
# this 10-d hand-crafted feature space.

name = "audio_exp_svm_rbf"
modality = "audio"

[data]
target_id = "m431"
train_dirs = [
    "dataset/target_train",
    "dataset/target_train_aug",
    "dataset/non_target_train",
    "dataset/non_target_train_aug",
]
dev_dirs   = ["dataset/target_dev", "dataset/non_target_dev"]
eval_dirs  = ["dataset/eval"]

[audio.vad]
algorithm = "energy_zcr"
frame_ms = 25
hop_ms = 10
preemphasis = 0.97
noise_percentile = 10.0
energy_margin_db = 8.0
zcr_aid_margin_db = 4.0
zcr_low = 0.02
zcr_high = 0.35
min_speech_ms = 100
min_silence_ms = 100

[audio.features]
f0_method = "pyin"
f0_min_hz = 60.0
f0_max_hz = 400.0
include = ["log_f0_mean", "log_f0_std", "jitter_local", "shimmer_local", "voicing_ratio"]
mfcc_n_means = 5
mfcc_n = 13
mel_filters = 23
cmvn = "per_utterance"

[classifier]
type = "svm_rbf"

[classifier.svm]
C = 1.0
class_weight = "balanced"
kernel = "rbf"
gamma = "scale"

[output]
result_filename = "audio_svm_rbf.txt"
score = "logit"
hard_threshold_logit = 0.0

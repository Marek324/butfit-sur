# Audio experiment: VAD turned OFF (all frames count as speech).
# Tests whether the energy+ZCR VAD is actually doing useful filtering of
# boundary booms / breath / silence. If audio_vad_off matches or beats the
# baseline, VAD isn't earning its keep on this dataset.

name = "audio_exp_vad_off"
modality = "audio"

[data]
target_id = "m431"
train_dirs = [
    "dataset/target_train",
    "dataset/target_train_aug",
    "dataset/non_target_train",
    "dataset/non_target_train_aug",
]
dev_dirs   = ["dataset/target_dev", "dataset/non_target_dev"]
eval_dirs  = ["dataset/eval"]

[audio.vad]
algorithm = "off"   # all frames become "speech"
frame_ms = 25
hop_ms = 10

[audio.features]
f0_method = "pyin"
f0_min_hz = 60.0
f0_max_hz = 400.0
include = ["log_f0_mean", "log_f0_std", "jitter_local", "shimmer_local", "voicing_ratio"]
mfcc_n_means = 5
mfcc_n = 13
mel_filters = 23
cmvn = "per_utterance"

[classifier]
type = "logreg"

[classifier.logreg]
C = 1.0
class_weight = "balanced"
penalty = "l2"
max_iter = 1000

[output]
result_filename = "audio_vad_off.txt"
score = "logit"
hard_threshold_logit = 0.0

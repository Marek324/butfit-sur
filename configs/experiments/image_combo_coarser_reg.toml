# Image experiment: combine the two best signals from the variant sweep -
# coarser HOG cells (16×16, 576-d) AND stronger regularization (C=0.1).
# Both reduce effective capacity in different ways; combining might help.

name = "image_exp_combo_coarser_reg"
modality = "image"

[data]
target_id = "m431"
train_dirs = [
    "dataset/target_train",
    "dataset/target_train_aug",
    "dataset/non_target_train",
    "dataset/non_target_train_aug",
]
dev_dirs   = ["dataset/target_dev", "dataset/non_target_dev"]
eval_dirs  = ["dataset/eval"]

[image.features]
method = "hog"
image_size = [80, 80]
grayscale = true
hog_orientations = 9
hog_pixels_per_cell = [16, 16]
hog_cells_per_block = [2, 2]
hog_block_norm = "L2-Hys"

[classifier]
type = "logreg"

[classifier.logreg]
C = 0.1
class_weight = "balanced"
penalty = "l2"
max_iter = 1000

[output]
result_filename = "image_combo.txt"
score = "logit"
hard_threshold_logit = 0.0

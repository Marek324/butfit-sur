# Image experiment: finer HOG cells (4×4 instead of 8×8) → 12996-d. Acts as
# the overfitting control — high-capacity feature should saturate clean dev
# even more and likely degrade harder under stress dev.

name = "image_exp_hog_finer"
modality = "image"

[data]
target_id = "m431"
train_dirs = [
    "dataset/target_train",
    "dataset/target_train_aug",
    "dataset/non_target_train",
    "dataset/non_target_train_aug",
]
dev_dirs   = ["dataset/target_dev", "dataset/non_target_dev"]
eval_dirs  = ["dataset/eval"]

[image.features]
method = "hog"
image_size = [80, 80]
grayscale = true
hog_orientations = 9
hog_pixels_per_cell = [4, 4]
hog_cells_per_block = [2, 2]
hog_block_norm = "L2-Hys"

[classifier]
type = "logreg"

[classifier.logreg]
C = 1.0
class_weight = "balanced"
penalty = "l2"
max_iter = 2000

[output]
result_filename = "image_hog_finer.txt"
score = "logit"
hard_threshold_logit = 0.0

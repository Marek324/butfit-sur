name = "fusion_baseline_logreg"
modality = "fusion"

[data]
target_id = "m431"
train_dirs = ["dataset/target_train", "dataset/non_target_train"]
dev_dirs   = ["dataset/target_dev",   "dataset/non_target_dev"]
eval_dirs  = ["dataset/eval"]

[fusion]
audio_artifact = "audio_baseline_logreg"
image_artifact = "image_baseline_logreg"
score_normalize = "zscore"
train_on = "dev"

[fusion.classifier]
type = "logreg"

[fusion.classifier.logreg]
C = 1.0
class_weight = "balanced"
penalty = "l2"
max_iter = 1000

[output]
result_filename = "fusion_logreg.txt"
score = "logit"
hard_threshold_logit = 0.0 

[project]
name = "sur"
version = "0.1.0"
description = "person-verification detector"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.10.0",
    "numpy>=2.4.4",
    "pillow>=11.3.0",
    "scikit-image>=0.25.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "huggingface-hub>=0.28.0",
    "ruff>=0.15.11",
    "silero-vad>=6.2.1",
    "ty>=0.0.31",
]

[tool.ty.environment]
extra-paths = ["src"]

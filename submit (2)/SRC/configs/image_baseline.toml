name = "image_baseline_logreg"
modality = "image"

[data]
target_id = "m431"
train_dirs = [
    "dataset/target_train",
    "dataset/target_train_aug",
    "dataset/non_target_train",
    "dataset/non_target_train_aug",
]
dev_dirs   = ["dataset/target_dev", "dataset/non_target_dev"]
eval_dirs  = ["dataset/eval"]

[validation]
strategy = "holdout_dev"
cv_folds = 2

[image.features]
method = "hog"
image_size = [80, 80]
grayscale = true
hog_orientations = 9
hog_pixels_per_cell = [8, 8]
hog_cells_per_block = [2, 2]
hog_block_norm = "L2-Hys"
pca_components = 0

[classifier]
type = "logreg"

[classifier.logreg]
C = 0.1
class_weight = "balanced"    
penalty = "l2"
max_iter = 1000

[output]
result_filename = "image_logreg.txt"
score = "logit"
hard_threshold_logit = 0.0  
